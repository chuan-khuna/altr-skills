[tools]
bun = "1.4.4"

[tasks.skills]
description = "Install the vendored agent skills"
run = [
  "bunx skills add mattpocock/skills#v1.3.2  --agent 'universal' --agent 'claude-code' -y",
  "bunx skills add obsidianmd/obsidian-skills --agent 'universal' --agent 'claude-code' -y",
]

[tasks.plugins]
description = "Install the local altr-stack plugins (altr-skills, context-weather)"
run = [
  "claude plugin marketplace add ./ --scope project",
  "claude plugin install altr-skills@altr-stack --scope project",
  "claude plugin update altr-skills@altr-stack --scope project",
  "claude plugin install context-weather@altr-stack --scope project",
  "claude plugin update context-weather@altr-stack --scope project",
]
